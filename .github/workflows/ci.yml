name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:gate
      - run: pnpm test:coverage
      - name: Install Playwright Chromium
        run: |
          # Playwright uses its own Chromium; the runner's Chrome APT index can
          # be temporarily inconsistent and is not needed for system libraries.
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ] && grep -Eq 'https?://dl[.]google[.]com/linux/chrome(-stable)?/deb' "$source"; then
              printf 'Disabling runner Chrome APT source: %s\n' "$source"
              sudo mv "$source" "$source.disabled"
            fi
          done
          pnpm exec playwright install --with-deps chromium
      - run: pnpm test:stories
      - run: pnpm build-storybook
      - run: pnpm build
      - run: pnpm test:e2e --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: |
            coverage
            playwright-report
            test-results
            storybook-static
          if-no-files-found: ignore
          retention-days: 7
